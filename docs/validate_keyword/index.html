<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation: Silent Cipher — Codeword Validation</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #c0392b;
    --dark-red: #7b241c;
    --navy: #0d1b2a;
    --navy2: #1a2d42;
    --cream: #e8dcc8;
    --gold: #c9a84c;
    --green: #27ae60;
    --mono: 'Share Tech Mono', monospace;
    --display: 'Oswald', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--navy);
    color: var(--cream);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  /* Vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 99;
  }

  .terminal {
    width: 100%;
    max-width: 580px;
    border: 1px solid rgba(192,57,43,0.4);
    background: rgba(13,27,42,0.95);
    box-shadow: 0 0 60px rgba(192,57,43,0.15), inset 0 0 30px rgba(0,0,0,0.5);
    position: relative;
  }

  .terminal-bar {
    background: var(--red);
    padding: 0.5rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .terminal-bar .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
  }

  .terminal-bar .title {
    font-family: var(--mono);
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.85);
    margin-left: auto;
    margin-right: auto;
    padding-right: 30px;
  }

  .terminal-body {
    padding: 2.5rem 2.5rem 2rem;
  }

  .classified-banner {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .classified-banner .label {
    display: inline-block;
    background: var(--red);
    color: white;
    font-family: var(--display);
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    padding: 0.25rem 1rem;
    margin-bottom: 1.2rem;
  }

  .main-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: 0.08em;
    color: white;
    line-height: 1.1;
    text-shadow: 0 0 30px rgba(192,57,43,0.4);
  }

  .sub-title {
    font-family: var(--display);
    font-weight: 300;
    font-size: 0.9rem;
    letter-spacing: 0.25em;
    color: var(--gold);
    margin-top: 0.4rem;
  }

  .divider {
    border: none;
    border-top: 1px solid rgba(192,57,43,0.35);
    margin: 1.5rem 0;
  }

  .prompt-line {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: rgba(232,220,200,0.5);
    margin-bottom: 1.5rem;
    line-height: 1.6;
  }

  .field-group {
    margin-bottom: 1.4rem;
  }

  label {
    display: block;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  select, input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(232,220,200,0.2);
    color: var(--cream);
    font-family: var(--mono);
    font-size: 0.95rem;
    padding: 0.7rem 1rem;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    appearance: none;
    -webkit-appearance: none;
    letter-spacing: 0.1em;
  }

  select:focus, input[type="text"]:focus {
    border-color: var(--red);
    box-shadow: 0 0 12px rgba(192,57,43,0.25);
  }

  input[type="text"]::placeholder {
    color: rgba(232,220,200,0.2);
    letter-spacing: 0.05em;
  }

  .submit-btn {
    width: 100%;
    margin-top: 0.5rem;
    background: var(--red);
    color: white;
    border: none;
    font-family: var(--display);
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 0.25em;
    padding: 0.85rem 1rem;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
  }

  .submit-btn:hover {
    background: var(--dark-red);
    box-shadow: 0 0 20px rgba(192,57,43,0.5);
  }

  .submit-btn:active { transform: translateY(1px); }

  /* Result panel */
  #result {
    margin-top: 1.5rem;
    padding: 1rem 1.2rem;
    border-left: 3px solid transparent;
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    line-height: 1.7;
    display: none;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

  #result.success {
    display: block;
    border-color: var(--green);
    background: rgba(39,174,96,0.08);
    color: var(--green);
  }

  #result.failure {
    display: block;
    border-color: var(--red);
    background: rgba(192,57,43,0.08);
    color: #e74c3c;
  }

  .result-icon {
    font-size: 1.2rem;
    display: block;
    margin-bottom: 0.4rem;
  }

  .blink {
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  .footer-line {
    margin-top: 1.5rem;
    font-size: 0.6rem;
    color: rgba(232,220,200,0.2);
    letter-spacing: 0.15em;
    text-align: center;
  }
</style>
</head>
<body>

<div class="terminal">
  <div class="terminal-bar">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="title">INTEL-SEC // CODEWORD VALIDATION TERMINAL</div>
  </div>
  <div class="terminal-body">

    <div class="classified-banner">
      <div class="label">&#9632; CLASSIFIED &#9632;</div>
      <div class="main-title">OPERATION<br>SILENT CIPHER</div>
      <div class="sub-title">CODEWORD VALIDATION</div>
    </div>

    <hr class="divider">

    <div class="prompt-line">
      ENTER YOUR TEAM DESIGNATION AND FINAL CODEWORD BELOW.<br>
      ALL SUBMISSIONS ARE LOGGED. AUTHORISED PERSONNEL ONLY.
    </div>

    <div class="field-group">
      <label>// TEAM DESIGNATION</label>
      <input type="text" id="team" placeholder="ENTER TEAM" autocomplete="off" spellcheck="false">
    </div>

    <div class="field-group">
      <label>// FINAL CODEWORD</label>
      <input type="text" id="codeword" placeholder="ENTER CODEWORD..." autocomplete="off" spellcheck="false">
    </div>

    <button class="submit-btn" onclick="___v()">VALIDATE CODEWORD</button>

    <div id="result"></div>

    <div class="footer-line">INTEL-SEC DIVISION &nbsp;|&nbsp; EYES ONLY &nbsp;|&nbsp; UNAUTHORISED ACCESS PROHIBITED<span class="blink">_</span></div>
  </div>
</div>
